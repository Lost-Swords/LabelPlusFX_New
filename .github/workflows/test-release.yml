name: Test Build & Package


on:
  workflow_dispatch:
    inputs:
      environment:
        type: string
        description: "Deployment environment"
        default: "dev"

jobs:
  build-windows:
    runs-on: windows-latest
    name: Build Windows Package (Test)

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17 (Liberica Full)
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'liberica'
          java-package: jdk-full

      - name: Setup Maven
        uses: stCarolas/setup-maven@v4
        with:
          maven-version: 3.8.6

      - name: Extract version from pom.xml (Windows)
        shell: pwsh
        run: |
          [xml]$pom = Get-Content pom.xml
          $version = $pom.project.version
          Write-Output "VERSION=$version"
          Write-Output "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV

      - name: Build project with Maven
        run: mvn clean package

      - name: Run build.bat
        shell: cmd
        run: |
          cd script\jpackage
          build.bat %VERSION%

      - name: Archive Windows ZIP
        uses: actions/upload-artifact@v4
        with:
          name: LabelPlusFX-${{ env.VERSION }}-Win64
          path: ${{ github.workspace }}/script/jpackage/Output/LabelPlusFX-${{ env.VERSION }}-Win64.zip

  build-macos:
    runs-on: macos-latest
    name: Build macOS Package (Test)

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17 (Liberica Full)
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'liberica'
          java-package: jdk-full

      - name: Extract version from pom.xml
        id: version
        run: |
          VERSION=$(xpath -q -e '/project/version/text()' pom.xml)
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Setup Maven
        uses: stCarolas/setup-maven@v4
        with:
          maven-version: 3.8.6

      - name: Clean Maven cache
        run: mvn dependency:purge-local-repository -DactTransitively=false -DreResolve=false

      - name: Build project with Maven
        run: mvn clean package

      - name: Make build.sh executable
        run: chmod +x script/jpackage/build.sh

      - name: Run build.sh
        run: |
          cd script/jpackage
          ./build.sh ${{ env.VERSION }}

      - name: Archive macOS ZIP
        uses: actions/upload-artifact@v4
        with:
          name: LabelPlusFX-${{ env.VERSION }}-Mac
          path: ${{ github.workspace }}/script/jpackage/Output/LabelPlusFX-${{ env.VERSION }}-Mac.zip
