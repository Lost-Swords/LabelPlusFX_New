name: Build & Package

on:
  push:
    branches:
      - v2-fork # Trigger on push to v2-fork branch

jobs:
  build-windows:
    runs-on: windows-latest
    name: Build Windows Package on v2-fork

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Maven
        uses: stCarolas/setup-maven@v4
        with:
          maven-version: 3.8.6

      - name: Extract version from pom.xml (Windows)
        shell: pwsh
        run: |
          [xml]$pom = Get-Content pom.xml
          $version = $pom.project.version
          Write-Output "VERSION=$version"
          Write-Output "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV

      - name: Build project with Maven
        run: mvn clean package

      - name: Run build.bat
        shell: cmd
        run: |
          cd script\jpackage
          build.bat %VERSION%

      - name: Archive Windows ZIP
        uses: actions/upload-artifact@v4
        with:
          name: LabelPlusFX-win-v2-fork
          path: LabelPlusFX/script/jpackage/Output/LabelPlusFX-${{ env.VERSION }}-Win64.zip

  build-macos:
    runs-on: macos-latest
    name: Build macOS Package on v2-fork

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17 with jpackage
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Extract version from pom.xml
        id: version
        run: |
          VERSION=$(xpath -q -e '/project/version/text()' pom.xml)
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Setup Maven
        uses: stCarolas/setup-maven@v4
        with:
          maven-version: 3.8.6

      - name: Build project with Maven
        run: mvn clean package

      - name: Make build.sh executable
        run: chmod +x script/jpackage/build.sh

      - name: Run build.sh
        run: |
          cd script/jpackage
          ./build.sh ${{ env.VERSION }}

      - name: Archive macOS ZIP
        uses: actions/upload-artifact@v4
        with:
          name: LabelPlusFX-mac-v2-fork
          path: LabelPlusFX/script/jpackage/Output/LabelPlusFX-${{ env.VERSION }}-Mac.zip
