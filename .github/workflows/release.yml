name: Build & Package

on:
  push:
    branches:
      - v2-fork # 当代码被推送到 v2-fork 分支时触发（包括从 v2-fork-develop 合并）

env:
  VERSION: ${{ github.sha }} # 使用 commit hash 作为测试版本号，也可以使用 tag

jobs:
  build-windows:
    runs-on: windows-latest
    name: Build Windows Package on v2-fork

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Maven
        uses: stCarolas/setup-maven@v4
        with:
          maven-version: 3.8.6

      - name: Build project with Maven
        run: mvn clean package

      - name: Run build.sh
        run: |
          cd script/jpackage
          ./build.sh ${{ env.VERSION }}


      - name: Archive Windows ZIP
        uses: actions/upload-artifact@v4
        with:
          name: LabelPlusFX-win-v2-fork
          path: LabelPlusFX/script/jpackage/Output/LabelPlusFX-${{ env.VERSION }}-Win64.zip

  build-macos:
    runs-on: macos-latest
    name: Build macOS Package on v2-fork

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17 with jpackage
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          'setup-jdks': true

      - name: Setup Maven
        uses: stCarolas/setup-maven@v4
        with:
          maven-version: 3.8.6

      - name: Build project with Maven
        run: mvn clean package

      - name: Make build.sh executable
        run: chmod +x script/jpackage/build.sh

      - name: Run build.sh
        run: |
          cd script/jpackage
          ./build.sh ${{ env.VERSION }}


      - name: Archive macOS ZIP
        uses: actions/upload-artifact@v4
        with:
          name: LabelPlusFX-mac-v2-fork
          path: LabelPlusFX/script/jpackage/Output/LabelPlusFX-${{ env.VERSION }}-Mac.zip